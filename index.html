<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit — 3D Personal Relationship Web</title>
    <meta name="description" content="A local-first interactive 3D relationship network map based on Dunbar circles and recency." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/theme.css" />
  </head>
  <body>
    <div id="app">
      <!-- 3D Canvas Container -->
      <div id="canvas-container"></div>

      <!-- Observatory Corner Crosshair Marks -->
      <div class="corner-crosshair crosshair-tl">+</div>
      <div class="corner-crosshair crosshair-tr">+</div>
      <div class="corner-crosshair crosshair-bl">+</div>
      <div class="corner-crosshair crosshair-br">+</div>

      <!-- Top Left: Brand Title, Count Readout, Camera Instrument Coordinates -->
      <div class="corner-top-left">
        <div class="brand-title">ORBIT</div>
        <div class="hud-readout" id="user-display-readout">VAULT: GUEST</div>
        <div class="hud-readout" id="people-count-readout">0 CONNECTIONS</div>
        <div class="hud-readout" id="camera-instrument-readout" style="color: #ff7686; margin-top: 2px;">
          AZ 0° EL 0° DIST 0
        </div>
      </div>

      <!-- Top Right: Plain Text Actions & Logout Link -->
      <div class="corner-top-right">
        <button type="button" class="btn-text" id="btn-search">SEARCH [/]</button>
        <button type="button" class="btn-text" id="btn-reset-cam">OVERVIEW</button>
        <button type="button" class="btn-text" id="btn-settings">SETTINGS</button>
        <button type="button" class="btn-text" id="btn-auth-action" style="color: #ff7686;">[SIGN IN]</button>
      </div>

      <!-- Bottom Left: Category Legend & Quiet Fading Connections List -->
      <div class="corner-bottom-left">
        <div id="category-filters-container"></div>
        <div id="fading-list-container"></div>
      </div>

      <!-- Bottom Right: Primary Action Button -->
      <div class="corner-bottom-right">
        <button type="button" class="btn-rect btn-primary" id="btn-add-person">
          + ADD PERSON [N]
        </button>
      </div>

      <!-- Tooltip -->
      <div id="tooltip">
        <div class="tooltip-name"></div>
        <div class="tooltip-meta"></div>
      </div>

      <!-- Quiet Toast Notification -->
      <div id="toast" class="toast"></div>

      <!-- Side Panels, Auth Overlay & Modals Mount Points -->
      <div id="auth-container"></div>
      <div id="detail-panel-container"></div>
      <div id="add-person-container"></div>
      <div id="search-container"></div>
      <div id="settings-container"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
